# Tekton Pipeline Security Scanner Configuration
# Trust lists for RHOAI/Konflux pipelines

trusted_git_sources:
  - "https://github.com/opendatahub-io/"
  - "https://github.com/red-hat-data-services/"
  - "https://github.com/konflux-ci/"
  - "https://github.com/redhat-appstudio/"

trusted_registries:
  - "quay.io/konflux-ci/"
  - "quay.io/redhat-appstudio/"
  - "quay.io/opendatahub/"

skip_checks: []

min_severity: "LOW"

# Secret workspaces that are known-safe and don't need readOnly warnings.
# PipelinesAsCode's git-auth workspace is standard and safe to suppress.
known_safe_secret_workspaces:
  - "git-auth"

# PaC params that are safe to pass through (go to structured task inputs,
# not injected into scripts). Suppresses TKN-RES-003 for these params.
known_safe_pac_params:
  - "git-url"
  - "revision"
  - "output-image"
  - "dockerfile"
  - "path-context"
  - "build-platforms"
  - "image-expires-after"
  - "build-version-tag"
  - "pipeline-type"
  - "additional-tags"
  - "additional-tag"

# Konflux-specific suppression:
# TKN-LOGIC-001 flags security tasks in spec.tasks (not spec.finally).
# In Konflux repos, this is by design: Enterprise Contract validates
# task results post-build, so security tasks run in the main pipeline.
# Uncomment to suppress for Konflux repos:
# skip_checks:
#   - "TKN-LOGIC-001"
