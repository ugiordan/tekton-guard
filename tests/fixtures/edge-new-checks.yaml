# RES-004 + LOGIC-008 positive: Pipeline with untrusted task result consumed by trusted task
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: result-flow-pipeline
spec:
  tasks:
  - name: untrusted-producer
    taskRef:
      resolver: hub
      params:
      - name: name
        value: some-task
  - name: trusted-consumer
    runAfter: [untrusted-producer]
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/opendatahub-io/tasks.git
      - name: revision
        value: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
    params:
    - name: input-value
      value: $(tasks.untrusted-producer.results.output)
    when:
    - input: $(tasks.untrusted-producer.results.status)
      operator: in
      values: ["success"]
  - name: also-untrusted-consumer
    taskRef:
      resolver: hub
      params:
      - name: name
        value: another-task
    params:
    - name: data
      value: $(tasks.untrusted-producer.results.output)
---
